<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Lesson Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #339966, #247a50);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .golf-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2.5rem;
        }
        p {
            margin: 0 0 2rem 0;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            background: white;
            color: #339966;
            padding: 1rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(() => {
            window.location.href = './simple-golf-tracker.html';
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <div class="golf-icon">🏌️</div>
        <h1>Golf Lesson Tracker</h1>
        <p>Redirecting to your golf lesson tracker...</p>
        <a href="./simple-golf-tracker.html" class="btn">
            Launch Golf Tracker →
        </a>
        <p style="margin-top: 1rem; font-size: 0.9rem;">
            Or click the button above to go directly
        </p>
    </div>
</body>
</html>
